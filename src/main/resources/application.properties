spring.application.name=sistema-tickets

# MySQL: la base de datos se crea sola si no existe
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tickets_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate genera/actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
